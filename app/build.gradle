apply plugin: "com.android.application"

android {
	buildToolsVersion "34.0.0"
	compileSdkVersion 34
	
	namespace "io.momu.frpmanager"
	defaultConfig {
		applicationId "io.momu.frpmanager"
		minSdkVersion 26
		targetSdkVersion 34
		versionCode 6
		versionName "1.4.2"
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	def releaseStoreFile = providers.gradleProperty("FRP_RELEASE_STORE_FILE").orNull ?: System.getenv("FRP_RELEASE_STORE_FILE")
	def releaseStorePassword = providers.gradleProperty("FRP_RELEASE_STORE_PASSWORD").orNull ?: System.getenv("FRP_RELEASE_STORE_PASSWORD")
	def releaseKeyAlias = providers.gradleProperty("FRP_RELEASE_KEY_ALIAS").orNull ?: System.getenv("FRP_RELEASE_KEY_ALIAS")
	def releaseKeyPassword = providers.gradleProperty("FRP_RELEASE_KEY_PASSWORD").orNull ?: System.getenv("FRP_RELEASE_KEY_PASSWORD")
	if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
		signingConfigs {
			release {
				storeFile file(releaseStoreFile)
				storePassword releaseStorePassword
				keyAlias releaseKeyAlias
				keyPassword releaseKeyPassword
			}
		}
	}
	packagingOptions {
		resources {
			excludes += [
				'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
				'org/bouncycastle/pqc/crypto/picnic/*.properties'
			]
		}
	}
	buildTypes {
		release {
			shrinkResources true
			minifyEnabled true
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
			if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
				signingConfig signingConfigs.release
			}
		}
	}
	buildFeatures{
		
	}
}

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	implementation 'com.hierynomus:sshj:0.38.0'
	implementation 'com.google.android.material:material:1.12.0'
	implementation 'androidx.annotation:annotation:1.8.0'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
	implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
	runtimeOnly fileTree(dir: 'runtime', include: ['*.jar'])
	compileOnly fileTree(dir: 'provider', include: ['.jar'])
	testImplementation 'junit:junit:4.13.2'
}
